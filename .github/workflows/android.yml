
name: Build Level Up Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir source
          unzip -q LevelUpAndroid_Project_zip -d source
          find source -name settings.gradle.kts -print

      - name: Build APK
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/source" -name settings.gradle.kts -print -quit)")"
          echo "Building project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon --max-workers=2 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-debug-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
